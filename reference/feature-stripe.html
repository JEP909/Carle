<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fraud prevention</title>
<style>
  :root {
    --ink: #0a2540;          /* Stripe slate — never pure black */
    --ink-2: #425466;
    --ink-3: #697386;
    --hair: #e6e9ee;
    --indigo: #635bff;
    --indigo-2: #7a73ff;
    --blue: #00d4ff;
    --sans: "Söhne", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background: #ffffff;
    font-family: var(--sans);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    display: grid;
    place-items: center;
    padding: 64px 32px;
  }

  .feature { width: 440px; }

  /* the diorama: a floating chart panel with a soft spectral glow behind its top */
  .panel-wrap { position: relative; }
  .panel-wrap::before {
    content: "";
    position: absolute;
    left: -8%; right: -8%; top: -10%;
    height: 60%;
    background:
      radial-gradient(40% 80% at 22% 0%, rgba(99,91,255,0.30), transparent 70%),
      radial-gradient(42% 80% at 70% 0%, rgba(0,212,255,0.26), transparent 72%),
      radial-gradient(38% 80% at 95% 10%, rgba(255,110,180,0.20), transparent 72%);
    filter: blur(10px);
    z-index: 0;
  }

  .panel {
    position: relative;
    z-index: 1;
    background: linear-gradient(180deg, #fcfcfe 0%, #ffffff 40%);
    border: 1px solid var(--hair);
    border-radius: 14px;
    padding: 22px 24px 18px;
    box-shadow:
      0 1px 2px rgba(10,37,64,0.04),
      0 12px 28px -14px rgba(10,37,64,0.14);
  }

  .panel h3 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-bottom: 16px;
  }

  .legend {
    display: flex;
    gap: 26px;
    margin-bottom: 18px;
  }
  .legend .item { display: flex; flex-direction: column; gap: 6px; }
  .legend .k {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--ink-2); font-weight: 500;
  }
  .legend .sw { width: 10px; height: 10px; border-radius: 3px; }
  .legend .v { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
  .legend .line-ic { width: 12px; height: 2px; background: var(--ink); border-radius: 2px; }

  .chart { width: 100%; height: 150px; display: block; }
  .axis { display: flex; justify-content: space-between; margin-top: 8px; }
  .axis span { font-size: 11px; color: var(--ink-3); }

  .copy { padding: 26px 4px 0; }
  .copy h2 {
    font-size: 25px;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.12;
    margin-bottom: 12px;
  }
  .copy p {
    font-size: 15.5px;
    line-height: 1.55;
    color: var(--ink-2);
    max-width: 42ch;
  }
  .copy p .em { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
  <article class="feature">
    <div class="panel-wrap">
      <div class="panel">
        <h3>Fraud</h3>
        <div class="legend">
          <div class="item">
            <span class="k"><span class="sw" style="background:#635bff"></span>Fraudulent disputes</span>
            <span class="v">0.06%</span>
          </div>
          <div class="item">
            <span class="k"><span class="sw" style="background:#4d7bff"></span>Early fraud warnings</span>
            <span class="v">0.02%</span>
          </div>
          <div class="item">
            <span class="k"><span class="line-ic"></span>Total fraud rate</span>
            <span class="v">0.08%</span>
          </div>
        </div>
        <svg class="chart" viewBox="0 0 396 140" preserveAspectRatio="none" aria-hidden="true">
          <!-- faint top gridline -->
          <line x1="0" y1="14" x2="396" y2="14" stroke="#eef1f5" stroke-width="1"/>
          <line x1="0" y1="124" x2="396" y2="124" stroke="#eef1f5" stroke-width="1"/>

          <!-- 12 columns: a rounded purple base bar + a DETACHED blue cap floating
               above it with a gap (the signature Stripe segmented look) -->
          <g>
            <!-- purple base bars: rounded all corners, lifted off the baseline -->
            <rect x="8"   y="52"  width="22" height="70" rx="5" fill="#635bff"/>
            <rect x="40"  y="64"  width="22" height="58" rx="5" fill="#635bff"/>
            <rect x="72"  y="58"  width="22" height="64" rx="5" fill="#635bff"/>
            <rect x="104" y="70"  width="22" height="52" rx="5" fill="#635bff"/>
            <rect x="136" y="80"  width="22" height="42" rx="5" fill="#635bff"/>
            <rect x="168" y="66"  width="22" height="56" rx="5" fill="#635bff"/>
            <rect x="200" y="74"  width="22" height="48" rx="5" fill="#635bff"/>
            <rect x="232" y="60"  width="22" height="62" rx="5" fill="#635bff"/>
            <rect x="264" y="72"  width="22" height="50" rx="5" fill="#635bff"/>
            <rect x="296" y="54"  width="22" height="68" rx="5" fill="#635bff"/>
            <rect x="328" y="68"  width="22" height="54" rx="5" fill="#635bff"/>
            <rect x="360" y="62"  width="22" height="60" rx="5" fill="#635bff"/>
            <!-- blue caps: separate rounded rects, ~9px gap above each bar -->
            <rect x="8"   y="29"  width="22" height="14" rx="5" fill="#4d7bff"/>
            <rect x="40"  y="43"  width="22" height="14" rx="5" fill="#4d7bff"/>
            <rect x="72"  y="37"  width="22" height="14" rx="5" fill="#4d7bff"/>
            <rect x="104" y="49"  width="22" height="14" rx="5" fill="#4d7bff"/>
            <rect x="136" y="59"  width="22" height="14" rx="5" fill="#4d7bff"/>
            <rect x="168" y="45"  width="22" height="14" rx="5" fill="#4d7bff"/>
            <rect x="200" y="53"  width="22" height="14" rx="5" fill="#4d7bff"/>
            <rect x="232" y="39"  width="22" height="14" rx="5" fill="#4d7bff"/>
            <rect x="264" y="51"  width="22" height="14" rx="5" fill="#4d7bff"/>
            <rect x="296" y="33"  width="22" height="14" rx="5" fill="#4d7bff"/>
            <rect x="328" y="47"  width="22" height="14" rx="5" fill="#4d7bff"/>
            <rect x="360" y="41"  width="22" height="14" rx="5" fill="#4d7bff"/>
          </g>

          <!-- total-rate trend line: smooth Catmull-ish curve through the points -->
          <path
            d="M19,46 C35,44 35,58 51,58 S83,52 99,62 S131,72 147,60
               S179,66 195,52 S227,64 243,46 S275,60 291,40 S323,54 339,50 379,46"
            fill="none" stroke="#0a2540" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="axis"><span>Jan</span><span>Apr</span><span>Aug</span><span>Dec</span></div>
      </div>
    </div>

    <div class="copy">
      <h2>Fraud prevention</h2>
      <p>Get real-time fraud prevention that automatically detects and blocks
      fraudulent transactions. Businesses using Stripe see a
      <span class="em">38% reduction in fraud</span> on average.</p>
    </div>
  </article>
</body>
</html>
